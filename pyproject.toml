[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-restore-drill"
version = "0.1.0"
description = "Rehearse validation of standalone SQLite backups in an isolated workspace."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.scripts]
sqlite-restore-drill = "sqlite_restore_drill.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/sqlite-restore-drill"
Issues = "https://github.com/KanadeK/sqlite-restore-drill/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]
"examples/*" = ["S101"]
