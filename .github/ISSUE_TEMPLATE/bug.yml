name: Bug report
description: Report a reproducible problem in sqlite-backup-probe
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Command, Python version, expected result and actual result. Use synthetic data.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal non-sensitive input
      description: Do not upload private data or credentials.
